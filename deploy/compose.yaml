# Gurow on one host: PostgreSQL, the Hono backend, the built frontend server and Caddy in
# front. Only Caddy is published. Settings come from deploy/.env on the host (see README.md).
name: gurow

services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_USER: gurow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in deploy/.env}
      POSTGRES_DB: gurow
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gurow -d gurow"]
      interval: 5s
      timeout: 3s
      retries: 30

  backend:
    build:
      context: ..
      dockerfile: deploy/backend.Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://gurow:${POSTGRES_PASSWORD}@postgres:5432/gurow
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in deploy/.env}
      # The one public origin the browser uses (ADR 0022); emailed links are built from it.
      BETTER_AUTH_URL: ${PUBLIC_ORIGIN:?set PUBLIC_ORIGIN in deploy/.env}
      EMAIL_VERIFICATION: ${EMAIL_VERIFICATION:-required}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      MAIL_FROM: ${MAIL_FROM:-}

  frontend:
    build:
      context: ..
      dockerfile: deploy/frontend.Dockerfile
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: "3000"
      GUROW_API_ORIGIN: http://backend:3001

  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - frontend
    ports:
      - "80:80"
      - "443:443"
    environment:
      # ":80" serves plain HTTP on any name or address; domain names (comma-separated) make Caddy obtain HTTPS for them.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
