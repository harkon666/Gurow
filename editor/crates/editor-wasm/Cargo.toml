[package]
name = "editor-wasm"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
engine-core = { path = "../engine-core" }
renderer-wgpu = { path = "../renderer-wgpu" }
wgpu = { version = "24", default-features = false, features = ["wgsl", "webgpu"] }
wasm-bindgen = "0.2.100"
wasm-bindgen-futures = "0.4.50"
js-sys = "0.3.77"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
console_error_panic_hook = "0.1"

[dependencies.web-sys]
version = "0.3.77"
features = [
    "console",
    "Document",
    "Element",
    "HtmlCanvasElement",
    "Window",
    "Performance",
]
